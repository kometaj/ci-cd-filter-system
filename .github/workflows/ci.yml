name: CI

on:
  push:
  pull_request:

jobs:
  lint-test-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Smoke test installed CLI
        run: |
          ci-path-filter --config examples/assignment-filters.yaml --output smoke.env App.kt src/test/FiltersTest.kt README.md
          grep -qx 'kotlin_sources=true' smoke.env
          grep -qx 'tests=true' smoke.env
          grep -qx 'documentation=true' smoke.env
